# @package _global_
# VICReg — random masking, particle-level (mask entire particles)
# Usage: python src/train.py experiment=ablation/vicreg_random_particle seed=42

defaults:
  - ablation/backbone_vicreg
  - _self_

tags: ["ablation", "augmentation", "vicreg", "random", "particle_level"]

model:
  augmentation_type: "random"
  mask_full_particle: true
  mask_probability: 0.3

logger:
  mlflow:
    run_name: "ablation_vicreg_random_particle"

# @package _global_
# VCReg d256: same arch as ablation d256, but pilot-style lr/wd + ckpt on val/acc.
# Addresses collapse seen at lr=1e-3 (esp. seed 31337).
defaults:
  - ablation/training/backbone_vcreg
  - new_exp/_final_vcreg
  - new_exp/_vcreg_lr1p5e4_acc
  - _self_

tags: ["new_exp", "vcreg", "dmodel256", "lr1p5e4", "ckpt_acc", "cern"]

model:
  d_model: 256
  d_ff: 1024

logger:
  mlflow:
    run_name: "vcreg_dmodel256_lr1p5e4_acc"

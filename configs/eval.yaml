# @package _global_

defaults:
  - data: collide2v_basic # choose datamodule with `test_dataloader()` for evaluation
  - preprocess: collide2v
  - model: tinyTransformer
  - callbacks: default
  - logger: mlflow
  - trainer: gpu
  - paths: fm_testing
  - extras: default
  - hydra: default
  - eval: probes  # Include probe evaluation config with UMAP parameters

  # choose experiment config with matching data and preprocessing settings to trained model, set use_trial_config: true to overwrite with
  # the saved config.yaml Hydra config from the exact training run that produced the checkpoint given below
  # Must name a config that exists. The encoder architecture comes from the
  # checkpoint's own hparams (load_from_checkpoint), so what this config decides is
  # the probe protocol — split sizes and paths — not the model.
  - experiment: new_exp/probe_vcreg_dmodel256

  - _self_

task_name: "eval"

# choose a run name and experiment name for logging evaluation results to MLflow
logger:
  mlflow:
    run_name: "best_run_evaluation"
    experiment_name: "debug"

tags: ["dev"]

# seed for reproducibility
seed: 42

# passing checkpoint path is necessary for evaluation
ckpt_path: null  # set via command line: ckpt_path=/path/to/checkpoint.ckpt
use_trial_config: true

# @package _global_
#
# Anomaly Detection: QCD (normal) vs Higgs (anomalies) using RAW FEATURES — nosparse CERN version
# 12-class nosparse (no DY_to_ll, Minbias_Soft_QCD, Upsilon_to_Leptons) + 3 Higgs signals.
# Baseline AE directly on raw input, no encoder.

defaults:
  - override /data: collide2v_basic
  - override /paths: fm_testing

mode: "raw"

tags: ["anomaly_detection", "qcd_vs_higgs", "raw_features", "baseline", "nosparse", "cern"]

normal_classes: [0]  # QCD_inclusive
anomaly_classes: [12, 13, 14]  # VBFHbb, HH_4b, ggHtautau

data:
  batch_size: 512
  train_val_test_split_per_class: [100_000, 10_000, 10_000]
  label: "v2_nosparse_higgs_smnorm_highlevel"
  num_workers: 7

  to_classify:
    - "QCD_inclusive"
    - "Z_to_vv_jet"
    - "Z_to_qq_uds"
    - "Z_to_bb"
    - "Z_to_cc"
    - "W_to_lv"
    - "W_to_qq"
    - "gamma"
    - "QCD_bb"
    - "tt_all-hadr"
    - "tt_semi-lept"
    - "tt_all-lept"
    - "VBFHbb"
    - "HH_4b"
    - "ggHtautau"

  datasets_config:
    jets:
      cols:
        - FullReco_JetPuppiAK4_PT
        - FullReco_JetPuppiAK4_Eta
        - FullReco_JetPuppiAK4_Phi
        - FullReco_JetPuppiAK4_Mass
        - FullReco_JetPuppiAK4_BTag
        - FullReco_JetPuppiAK4_Charge
        - FullReco_JetPuppiAK4_NNeutrals
      topk: 12
      count: true

    electrons:
      cols:
        - FullReco_Electron_PT
        - FullReco_Electron_Eta
        - FullReco_Electron_Phi
        - FullReco_Electron_Charge
        - FullReco_Electron_EhadOverEem
        - FullReco_Electron_IsolationVarRhoCorr
        - FullReco_Electron_D0
        - FullReco_Electron_DZ
      topk: 8
      count: false

    muons:
      cols:
        - FullReco_MuonTight_PT
        - FullReco_MuonTight_Eta
        - FullReco_MuonTight_Phi
        - FullReco_MuonTight_Charge
        - FullReco_MuonTight_IsolationVarRhoCorr
        - FullReco_MuonTight_D0
        - FullReco_MuonTight_DZ
      topk: 8
      count: false

    photons:
      cols:
        - FullReco_PhotonTight_PT
        - FullReco_PhotonTight_Eta
        - FullReco_PhotonTight_Phi
        - FullReco_PhotonTight_EhadOverEem
        - FullReco_PhotonTight_IsolationVarRhoCorr
      topk: 8
      count: false

    puppi_met:
      cols:
        - FullReco_PUPPIMET_MET
        - FullReco_PUPPIMET_Phi
      topk: null
      count: false

model:
  compression: 4
  depth: 4
  dropout: 0.03473
  lr: 1.965e-4
  weight_decay: 3.023e-5

trainer:
  max_epochs: 50
  gradient_clip_val: 1.0

preprocess:
  enabled: false

logger:
  mlflow:
    run_name: "ae_qcd_vs_higgs_raw_nosparse_cern"
    experiment_name: "anomaly_detection"

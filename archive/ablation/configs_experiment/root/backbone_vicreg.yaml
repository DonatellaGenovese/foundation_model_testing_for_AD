# @package _global_
#
# VICReg backbone for ablation.
# Inherits backbone_common (data, paths, logger, eval).
# Architecture identical to other ablation backbones.
# LR is 1e-3 (vs 1e-4 for contrastive models) due to different loss scale (~100 vs ~2-5).

defaults:
  - backbone_common
  - override /model: vicreg
  - override /callbacks: supcon
  - override /trainer: gpu
  - _self_

tags: ["ablation", "vicreg", "dmodel128", "100k"]

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  d_model: 128
  n_heads: 8
  num_layers: 6
  d_ff: 512           # 4× d_model
  dropout: 0.1
  compile: false

  projection_dim: 64
  hidden_projection_dim: 256

  augmentation_type: "random"   # overridden by augmentation configs
  mask_probability: 0.3
  mask_full_particle: false
  mask_noise_std: 0.0
  use_classification_head: false

  inv_weight: 25.0
  var_weight: 25.0
  cov_weight: 1.0

  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 1e-3
    weight_decay: 1e-5
    eps: 1e-08
    betas: [0.9, 0.999]

  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: min
    factor: 0.2
    patience: 10
    threshold: 0.0001
    threshold_mode: rel
    T_max: null
    eta_min: null

# ── Trainer ───────────────────────────────────────────────────────────────────
trainer:
  min_epochs: 1
  max_epochs: 50
  max_steps: -1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  accumulate_grad_batches: 1
  precision: 32

# ── Callbacks ─────────────────────────────────────────────────────────────────
callbacks:
  model_checkpoint:
    monitor: "val/vicreg_loss"
    mode: "min"
    save_top_k: 1
    save_last: true   # standardized across all ablation backbones
    filename: "epoch_{epoch:03d}"
  early_stopping:
    monitor: "val/vicreg_loss"
    patience: 20
    mode: "min"

# ── Logger ────────────────────────────────────────────────────────────────────
logger:
  mlflow:
    run_name: "ablation_vicreg_backbone"

# @package _global_
#
# CASE held-out signals for anomaly detection — SM-only normalisation.
#
# Same contract as new_exp/anomaly_newsig_smnorm: inference only, on processes that
# played no part in training, normalisation or threshold calibration. What differs is
# the provenance and the splitting.
#
# Provenance: these come from /eos/cms/store/group/phys_b2g/CASE/collide_test, a
# different production than the rest of the dataset. Their parquet files carry 262
# columns against our 271 — the nine missing ones are all AK8 jet-constituent lists,
# none of which this pipeline reads. All 29 columns below were verified present in
# every one of the 45 processes there, and the element types match; only the Arrow
# inner-list field name differs (`item` vs `element`), which awkward absorbs.
# `paths.dataset_dir` therefore points at a directory of symlinks gathering the CASE
# folders next to QCD_HT50toInf, so a single base_dir covers both productions.
#
# Splitting: each CASE process has exactly ONE parquet of 5,000 events, while
# make_split_manifest assigns whole files greedily train -> val -> test, so a single
# file would land in train and leave test empty. The manifest is therefore built by
# scripts/prepare_case_smnorm.py, which lists each signal file in all three splits:
# has_enough_events refuses to build the datamodule if any (split, class) pair has no
# files, so test-only is not an option. Only the test split is ever read downstream.
#
# Class indices (order of to_classify):
#   normal   : [0]               — QCD_inclusive, the AE's trained normality
#   anomaly  : [1..7]            — the seven CASE processes

defaults:
  - override /data: collide2v_basic
  - override /paths: fm_testing

mode: "embedding"

ckpt_path: null

model_class: "src.models.collide2v_vicreg.COLLIDE2VVCRegLitModule"

embedding_output_dir: "${paths.output_dir}/embeddings"

use_projections: false

tags: ["anomaly_detection", "case_signals", "inference", "cern", "nosparse", "smnorm"]

normal_classes: [0]
anomaly_classes: [1, 2, 3, 4, 5, 6, 7]

paths:
  dataset_dir: /eos/user/d/dgenoves/foundation_model_testing_data/_case_src

data:
  batch_size: 512
  # 5_000 because that is all each CASE signal has (one parquet). The value is
  # also LocalVectorDataset's per_class_limit, so it caps QCD at 5_000 per split
  # too; QCD here only measures the achieved false-positive rate, since the
  # threshold comes from val_thresholds in the AE checkpoint.
  train_val_test_split_per_class: [5_000, 5_000, 5_000]
  label: "v2_nosparse_case_smnorm_highlevel"
  num_workers: 32

  to_classify:
    - "QCD_inclusive"                 # 0 — normal (AE trained on this)
    - "hToAA_4b_ma60"                 # 1 — h->aa->4b, resolved b-jets
    - "hToAA_4tau_ma15"               # 2 — h->aa->4tau
    - "HVdilep_Zp1000_piD2_mumu"      # 3 — hidden valley, dimuon-rich
    - "RPV_squark300_UDD"             # 4 — RPV squark, high multiplicity
    - "RPV_squark600_cascade_LSP550"  # 5 — RPV cascade, hardest
    - "SUEPlike_HV_mPhi400_mX2_Lam4"  # 6 — SUEP-like
    - "Zprime_qq_m500"                # 7 — resonant dijet

  # Folder names equal process names for the CASE samples, so the mapping is the
  # identity there; QCD_inclusive keeps the mapping inherited from collide2v_basic.
  process_to_folder:
    "hToAA_4b_ma60": "hToAA_4b_ma60"
    "hToAA_4tau_ma15": "hToAA_4tau_ma15"
    "HVdilep_Zp1000_piD2_mumu": "HVdilep_Zp1000_piD2_mumu"
    "RPV_squark300_UDD": "RPV_squark300_UDD"
    "RPV_squark600_cascade_LSP550": "RPV_squark600_cascade_LSP550"
    "SUEPlike_HV_mPhi400_mX2_Lam4": "SUEPlike_HV_mPhi400_mX2_Lam4"
    "Zprime_qq_m500": "Zprime_qq_m500"

  datasets_config:
    jets:
      cols:
        - FullReco_JetPuppiAK4_PT
        - FullReco_JetPuppiAK4_Eta
        - FullReco_JetPuppiAK4_Phi
        - FullReco_JetPuppiAK4_Mass
        - FullReco_JetPuppiAK4_BTag
        - FullReco_JetPuppiAK4_Charge
        - FullReco_JetPuppiAK4_NNeutrals
      topk: 12
      count: true

    electrons:
      cols:
        - FullReco_Electron_PT
        - FullReco_Electron_Eta
        - FullReco_Electron_Phi
        - FullReco_Electron_Charge
        - FullReco_Electron_EhadOverEem
        - FullReco_Electron_IsolationVarRhoCorr
        - FullReco_Electron_D0
        - FullReco_Electron_DZ
      topk: 8
      count: false

    muons:
      cols:
        - FullReco_MuonTight_PT
        - FullReco_MuonTight_Eta
        - FullReco_MuonTight_Phi
        - FullReco_MuonTight_Charge
        - FullReco_MuonTight_IsolationVarRhoCorr
        - FullReco_MuonTight_D0
        - FullReco_MuonTight_DZ
      topk: 8
      count: false

    photons:
      cols:
        - FullReco_PhotonTight_PT
        - FullReco_PhotonTight_Eta
        - FullReco_PhotonTight_Phi
        - FullReco_PhotonTight_EhadOverEem
        - FullReco_PhotonTight_IsolationVarRhoCorr
      topk: 8
      count: false

    puppi_met:
      cols:
        - FullReco_PUPPIMET_MET
        - FullReco_PUPPIMET_Phi
      topk: null
      count: false

preprocess:
  enabled: false

logger:
  mlflow:
    run_name: "anomaly_case_smnorm"
    experiment_name: "anomaly_detection"

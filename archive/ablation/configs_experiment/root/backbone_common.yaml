# @package _global_
#
# Common backbone for ALL ablation experiments.
# Defines: data (12 classes, 100k/class), paths, logger, eval.
# Does NOT define model or callbacks — those are model-specific.
#
# Per-model backbones (backbone_aug_supcon, backbone_selfsupcon, backbone_vicreg)
# inherit this file and add their own model + callbacks + trainer settings.

defaults:
  - override /data: collide2v_basic
  - override /paths: ablation_cern
  - override /logger: mlflow
  - _self_

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  batch_size: 1024
  train_val_test_split_per_class: [100_000, 10_000, 10_000]
  label: "v2_12class_nosparse_highlevel"
  num_workers: 32

  to_classify:
    - "QCD_inclusive"
    - "Z_to_vv_jet"
    - "Z_to_qq_uds"
    - "Z_to_bb"
    - "Z_to_cc"
    - "W_to_lv"
    - "W_to_qq"
    - "gamma"
    - "QCD_bb"
    - "tt_all-hadr"
    - "tt_semi-lept"
    - "tt_all-lept"

  datasets_config:
    jets:
      cols:
        - FullReco_JetPuppiAK4_PT
        - FullReco_JetPuppiAK4_Eta
        - FullReco_JetPuppiAK4_Phi
        - FullReco_JetPuppiAK4_Mass
        - FullReco_JetPuppiAK4_BTag
        - FullReco_JetPuppiAK4_Charge
        - FullReco_JetPuppiAK4_NNeutrals
      topk: 12
      count: true
    electrons:
      cols:
        - FullReco_Electron_PT
        - FullReco_Electron_Eta
        - FullReco_Electron_Phi
        - FullReco_Electron_Charge
        - FullReco_Electron_EhadOverEem
        - FullReco_Electron_IsolationVarRhoCorr
        - FullReco_Electron_D0
        - FullReco_Electron_DZ
      topk: 8
      count: false
    muons:
      cols:
        - FullReco_MuonTight_PT
        - FullReco_MuonTight_Eta
        - FullReco_MuonTight_Phi
        - FullReco_MuonTight_Charge
        - FullReco_MuonTight_IsolationVarRhoCorr
        - FullReco_MuonTight_D0
        - FullReco_MuonTight_DZ
      topk: 8
      count: false
    photons:
      cols:
        - FullReco_PhotonTight_PT
        - FullReco_PhotonTight_Eta
        - FullReco_PhotonTight_Phi
        - FullReco_PhotonTight_EhadOverEem
        - FullReco_PhotonTight_IsolationVarRhoCorr
      topk: 8
      count: false
    puppi_met:
      cols:
        - FullReco_PUPPIMET_MET
        - FullReco_PUPPIMET_Phi
      topk: null
      count: false

# ── Preprocessing ─────────────────────────────────────────────────────────────
preprocess:
  enabled: true

# ── Logger ────────────────────────────────────────────────────────────────────
logger:
  mlflow:
    experiment_name: "ablation_augmentation"

# ── Eval ──────────────────────────────────────────────────────────────────────
eval:
  linear_probe:
    max_epochs: 15
    lr: 0.001
    weight_decay: 0.0
  save_visualizations: true
  max_visualization_samples: 10000
  umap_n_neighbors: 15
  umap_min_dist: 0.1
  umap_metric: "cosine"
  output_dir: ${paths.output_dir}/probe_evaluation

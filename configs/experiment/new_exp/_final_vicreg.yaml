# @package _global_
#
# Mixin: production-run overrides for VICReg on top of the ablation backbone.
# No defaults referencing the ablation backbone here (avoids Hydra nested-relative
# resolution issues); pulled in by the per-d_model primary configs together with
# backbone/backbone_vicreg.
#
# Re-run after early-checkpoint failure of the first new_exp VICReg campaign:
#   - keep Physics augmentation
#   - num_layers=4 (match successful old encoder_seeds; safer than ablation's 2)
#   - accumulate_grad_batches=8 (restore old VICReg; stabilises var/cov + ckpt selection)
#   - n_heads=4, d_ff=512 fixed across d_model scan; projection_dim = d/2 in children
#   - lr=1e-3, wd=1e-5, inv/var/cov=25/25/1, precision=32

model:
  n_heads: 4
  num_layers: 4
  augmentation_type: "physics"
  eta_sigma: 1.5
  pt_sigma: 0.1

data:
  train_val_test_split_per_class: [1_000_000, 100_000, 100_000]
  num_workers: 8

trainer:
  max_epochs: 100
  precision: 32
  accumulate_grad_batches: 8

callbacks:
  model_checkpoint:
    save_last: false

logger:
  mlflow:
    experiment_name: "new_exp_vicreg_physics"
    tracking_uri: /eos/user/d/dgenoves/anomaly_pipeline/new_exp/logs/mlflow/mlruns

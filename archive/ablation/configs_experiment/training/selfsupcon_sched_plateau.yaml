# @package _global_
# selfsupcon scheduler=plateau ablation — standard d=128 architecture.
defaults:
  - ablation/training/backbone_selfsupcon
  - override /paths: ablation_sched_cern
  - _self_

tags: ["ablation", "sched", "selfsupcon", "d128", "sched_plateau"]

model:
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: min
    factor: 0.2
    patience: 10
    threshold: 0.0001
    threshold_mode: rel
    T_max: null
    eta_min: null

logger:
  mlflow:
    experiment_name: "ablation_sched"
    run_name: "selfsupcon_sched_plateau"

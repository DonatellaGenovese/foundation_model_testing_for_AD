# @package _global_
#
# Additional held-out proxy (HH->bbtautau) for anomaly detection — SM-only normalisation.
#
# Inference only: the encoder and the autoencoder are already trained (the AE on
# QCD embeddings alone), and the anomaly threshold is the val-calibrated one
# stored in the AE checkpoint. Nothing here is fitted — these processes are held
# out in the strongest sense, having played no part in training, normalisation, or
# threshold calibration.
#
# data.label points at a dataset built with the statistics fitted on the 12 SM
# classes only, the same scale the encoder was trained with. Refitting the
# normalisation on a sample containing these signals would let them define the
# feature scale they are then evaluated against.
#
# Class indices (order of to_classify):
#   normal   : [0]           — QCD_inclusive, the AE's trained normality
#   anomaly  : [1]           — HH->bbtautau
#
# WHY THE LABEL IS v3. The v2 tree held six classes -- VVV, VH, tttt and ttH were
# scored during the study but are not in the paper -- and HH_bbtautau sat at position
# 5, so its events carry y=5 in every `_y.npy` and every embedding saved from that
# tree. Here it is position 1. Labels are positions in to_classify, not names, so a
# v2 file read through this config would report VVV (y=1) as HH_bbtautau, with no
# error anywhere. A new label keeps the two trees apart, and infer_new_signals.py
# gives v3 its own embedding and result roots for the same reason.
#
# Splits are small because only the test split is used; train/val exist so the
# datamodule can be built.

defaults:
  - override /data: collide2v_basic
  - override /paths: fm_testing

mode: "embedding"

ckpt_path: null

model_class: "src.models.collide2v_vicreg.COLLIDE2VVCRegLitModule"

embedding_output_dir: "${paths.output_dir}/embeddings"

use_projections: false

tags: ["anomaly_detection", "new_signals", "inference", "cern", "nosparse", "smnorm"]

normal_classes: [0]
anomaly_classes: [1]

data:
  batch_size: 512
  train_val_test_split_per_class: [20_000, 20_000, 20_000]
  label: "v3_nosparse_newsig_smnorm_highlevel"
  num_workers: 32

  to_classify:
    - "QCD_inclusive"     # 0 — normal (AE trained on this)
    - "HH_bbtautau"       # 1 — di-Higgs, bb tautau decay

  datasets_config:
    jets:
      cols:
        - FullReco_JetPuppiAK4_PT
        - FullReco_JetPuppiAK4_Eta
        - FullReco_JetPuppiAK4_Phi
        - FullReco_JetPuppiAK4_Mass
        - FullReco_JetPuppiAK4_BTag
        - FullReco_JetPuppiAK4_Charge
        - FullReco_JetPuppiAK4_NNeutrals
      topk: 12
      count: true

    electrons:
      cols:
        - FullReco_Electron_PT
        - FullReco_Electron_Eta
        - FullReco_Electron_Phi
        - FullReco_Electron_Charge
        - FullReco_Electron_EhadOverEem
        - FullReco_Electron_IsolationVarRhoCorr
        - FullReco_Electron_D0
        - FullReco_Electron_DZ
      topk: 8
      count: false

    muons:
      cols:
        - FullReco_MuonTight_PT
        - FullReco_MuonTight_Eta
        - FullReco_MuonTight_Phi
        - FullReco_MuonTight_Charge
        - FullReco_MuonTight_IsolationVarRhoCorr
        - FullReco_MuonTight_D0
        - FullReco_MuonTight_DZ
      topk: 8
      count: false

    photons:
      cols:
        - FullReco_PhotonTight_PT
        - FullReco_PhotonTight_Eta
        - FullReco_PhotonTight_Phi
        - FullReco_PhotonTight_EhadOverEem
        - FullReco_PhotonTight_IsolationVarRhoCorr
      topk: 8
      count: false

    puppi_met:
      cols:
        - FullReco_PUPPIMET_MET
        - FullReco_PUPPIMET_Phi
      topk: null
      count: false

preprocess:
  enabled: false

logger:
  mlflow:
    run_name: "anomaly_newsig_smnorm"
    experiment_name: "anomaly_detection"

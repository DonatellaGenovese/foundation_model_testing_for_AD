_target_: src.models.collide2v_vicreg.COLLIDE2VVCRegLitModule

# Encoder (TinyTransformer)
d_model: 512
n_heads: 4
num_layers: 4
d_ff: 2048
dropout: 0.1

# VCReg regularisation weights (paper defaults: var=25, cov=1)
var_weight: 25.0
cov_weight: 1.0

# Silhouette score (computed on validation embeddings each epoch)
silhouette_max_samples: 20000

# Compile model (PyTorch 2.0+)
compile: false

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.5e-4
  weight_decay: 5e-4
  eps: 1e-08
  betas: [0.9, 0.999]

scheduler: null

# @package _global_
#
# Mixin: production-run overrides for SupCon (AugSupCon) on top of the
# ablation backbone. No defaults referencing the ablation backbone here
# (avoids Hydra nested-relative resolution issues); pulled in by the
# per-d_model primary configs together with backbone/backbone_aug_supcon.
#
# Values follow tab:hparams_final + user decisions for new_exp:
#   - daggered: Physics aug, lambda_cls=0.50
#   - lr=5e-4 (ablation-preferred), wd=1e-5 (user; ablation flat for SupCon),
#     batch_size=512 (ablation-preferred vs old 2048)
#   - arch at d128 fixed across scan: n_heads=8, n_layers=6, d_ff=1024,
#     dropout=0.10, projection_dim=32, tau=0.10
#   - ReduceLROnPlateau retained; save_last=false

model:
  n_heads: 8
  num_layers: 6
  d_ff: 1024
  dropout: 0.10
  projection_dim: 32
  hidden_projection_dim: 128

  augmentation_type: "physics"
  eta_sigma: 1.5
  pt_sigma: 0.1
  mask_probability: 0.20
  mask_full_particle: false

  temperature: 0.10
  base_temperature: 0.10
  use_classification_head: true
  classification_weight: 0.50

  optimizer:
    lr: 5.0e-4
    weight_decay: 1.0e-5

data:
  batch_size: 512
  train_val_test_split_per_class: [1_000_000, 100_000, 100_000]
  num_workers: 8

trainer:
  max_epochs: 50
  precision: bf16-mixed

callbacks:
  model_checkpoint:
    save_last: false

logger:
  mlflow:
    experiment_name: "new_exp_supcon"
    tracking_uri: /eos/user/d/dgenoves/anomaly_pipeline/new_exp/logs/mlflow/mlruns

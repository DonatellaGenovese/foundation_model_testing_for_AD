# @package _global_
# VICReg — random masking, feature-level (baseline augmentation)
# Usage: python src/train.py experiment=ablation/vicreg_random_feature seed=42

defaults:
  - ablation/backbone_vicreg
  - _self_

tags: ["ablation", "augmentation", "vicreg", "random", "feature_level"]

model:
  augmentation_type: "random"
  mask_full_particle: false
  mask_probability: 0.3

logger:
  mlflow:
    run_name: "ablation_vicreg_random_feature"

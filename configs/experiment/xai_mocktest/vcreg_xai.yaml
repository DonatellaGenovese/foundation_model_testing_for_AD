# @package _global_
#
# VCReg training for XAI/GMM mocktest.
# Best params from loss ablation: var_weight=25, cov_weight=1, d_model=128.
# Filtered dataset: v2_12class_nosparse_highlevel, 550k/68750/68750 per class.

defaults:
  - override /data: collide2v_basic
  - override /paths: xai_mocktest_cern
  - override /model: vcreg
  - override /callbacks: supcon
  - override /trainer: gpu
  - override /logger: mlflow
  - _self_

tags: ["xai_mocktest", "vcreg", "filtered", "550k", "d128"]

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  batch_size: 1024
  train_val_test_split_per_class: [550_000, 68_750, 68_750]
  label: "v2_12class_nosparse_highlevel"
  num_workers: 32

  to_classify:
    - "QCD_inclusive"
    - "Z_to_vv_jet"
    - "Z_to_qq_uds"
    - "Z_to_bb"
    - "Z_to_cc"
    - "W_to_lv"
    - "W_to_qq"
    - "gamma"
    - "QCD_bb"
    - "tt_all-hadr"
    - "tt_semi-lept"
    - "tt_all-lept"

  datasets_config:
    jets:
      cols:
        - FullReco_JetPuppiAK4_PT
        - FullReco_JetPuppiAK4_Eta
        - FullReco_JetPuppiAK4_Phi
        - FullReco_JetPuppiAK4_Mass
        - FullReco_JetPuppiAK4_BTag
        - FullReco_JetPuppiAK4_Charge
        - FullReco_JetPuppiAK4_NNeutrals
      topk: 12
      count: true
    electrons:
      cols:
        - FullReco_Electron_PT
        - FullReco_Electron_Eta
        - FullReco_Electron_Phi
        - FullReco_Electron_Charge
        - FullReco_Electron_EhadOverEem
        - FullReco_Electron_IsolationVarRhoCorr
        - FullReco_Electron_D0
        - FullReco_Electron_DZ
      topk: 8
      count: false
    muons:
      cols:
        - FullReco_MuonTight_PT
        - FullReco_MuonTight_Eta
        - FullReco_MuonTight_Phi
        - FullReco_MuonTight_Charge
        - FullReco_MuonTight_IsolationVarRhoCorr
        - FullReco_MuonTight_D0
        - FullReco_MuonTight_DZ
      topk: 8
      count: false
    photons:
      cols:
        - FullReco_PhotonTight_PT
        - FullReco_PhotonTight_Eta
        - FullReco_PhotonTight_Phi
        - FullReco_PhotonTight_EhadOverEem
        - FullReco_PhotonTight_IsolationVarRhoCorr
      topk: 8
      count: false
    puppi_met:
      cols:
        - FullReco_PUPPIMET_MET
        - FullReco_PUPPIMET_Phi
      topk: null
      count: false

# ── Preprocessing ─────────────────────────────────────────────────────────────
preprocess:
  enabled: true

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  d_model: 128
  n_heads: 8
  num_layers: 6
  d_ff: 512
  dropout: 0.1
  compile: false

  var_weight: 25.0
  cov_weight: 1.0

  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 1e-3
    weight_decay: 1e-5
    eps: 1e-08
    betas: [0.9, 0.999]

  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: min
    factor: 0.2
    patience: 10
    threshold: 0.0001
    threshold_mode: rel
    T_max: null
    eta_min: null

# ── Trainer ───────────────────────────────────────────────────────────────────
trainer:
  min_epochs: 1
  max_epochs: 50
  max_steps: -1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  accumulate_grad_batches: 1
  precision: 32

# ── Callbacks ─────────────────────────────────────────────────────────────────
callbacks:
  model_checkpoint:
    monitor: "val/vcreg_loss"
    mode: "min"
    save_top_k: 1
    save_last: true
    filename: "epoch_{epoch:03d}"
  early_stopping:
    monitor: "val/vcreg_loss"
    patience: 20
    mode: "min"

# ── Eval ──────────────────────────────────────────────────────────────────────
eval:
  linear_probe:
    max_epochs: 15
    lr: 0.001
    weight_decay: 0.0
  save_visualizations: false
  output_dir: ${paths.output_dir}/probe_evaluation

# ── Logger ────────────────────────────────────────────────────────────────────
logger:
  mlflow:
    experiment_name: "xai_mocktest"
    run_name: "vcreg_xai_550k"

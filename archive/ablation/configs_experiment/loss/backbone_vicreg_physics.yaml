# @package _global_
#
# VICReg backbone for loss ablation.
# Uses physics augmentation (most stable from augmentation ablation).
# inv_weight is overridden by individual configs; var_weight=25, cov_weight=1 fixed.

defaults:
  - backbone_common
  - override /model: vicreg
  - override /callbacks: supcon
  - override /trainer: gpu
  - override /paths: ablation_loss_contrastive_cern
  - _self_

tags: ["ablation", "loss", "vicreg", "dmodel128", "100k", "physics"]

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  d_model: 128
  n_heads: 8
  num_layers: 6
  d_ff: 512
  dropout: 0.1
  compile: false

  projection_dim: 64
  hidden_projection_dim: 256

  augmentation_type: "physics"
  mask_probability: 0.3
  mask_full_particle: false
  mask_noise_std: 0.0
  use_classification_head: false

  inv_weight: 25.0    # overridden by individual ablation configs
  var_weight: 25.0    # fixed (optimal from VCReg ablation)
  cov_weight: 1.0     # fixed (optimal from VCReg ablation)

  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 1e-3
    weight_decay: 1e-5
    eps: 1e-08
    betas: [0.9, 0.999]

  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: min
    factor: 0.2
    patience: 10
    threshold: 0.0001
    threshold_mode: rel
    T_max: null
    eta_min: null

# ── Trainer ───────────────────────────────────────────────────────────────────
trainer:
  min_epochs: 1
  max_epochs: 50
  max_steps: -1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  accumulate_grad_batches: 1
  precision: 32

# ── Callbacks ─────────────────────────────────────────────────────────────────
callbacks:
  model_checkpoint:
    monitor: "val/vicreg_loss"
    mode: "min"
    save_top_k: 1
    save_last: true
    filename: "epoch_{epoch:03d}"
  early_stopping:
    monitor: "val/vicreg_loss"
    patience: 20
    mode: "min"

# ── Logger ────────────────────────────────────────────────────────────────────
logger:
  mlflow:
    experiment_name: "ablation_loss_contrastive"
    run_name: "ablation_vicreg_loss_backbone"

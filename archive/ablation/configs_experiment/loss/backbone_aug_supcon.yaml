# @package _global_
#
# AugSupCon backbone for loss ablation.
# Uses random_particle augmentation (best from augmentation ablation).
# temperature and classification_weight are overridden by individual configs.

defaults:
  - backbone_common
  - override /model: augmented_supcon
  - override /callbacks: supcon
  - override /trainer: gpu
  - override /paths: ablation_loss_contrastive_cern
  - _self_

tags: ["ablation", "loss", "aug_supcon", "dmodel128", "100k", "random_particle"]

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  d_model: 128
  n_heads: 8
  num_layers: 6
  d_ff: 512
  dropout: 0.1
  compile: false

  projection_dim: 64
  hidden_projection_dim: 256

  augmentation_type: "random"
  mask_full_particle: true      # random_particle (best augmentation)
  mask_probability: 0.3

  temperature: 0.1              # overridden by individual ablation configs
  base_temperature: 0.1         # kept equal to temperature

  use_classification_head: true
  classification_weight: 0.1    # overridden by cw ablation configs

  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 1e-4
    weight_decay: 1e-2
    eps: 1e-8
    betas: [0.9, 0.999]

  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: min
    factor: 0.2
    patience: 10
    threshold: 0.0001
    threshold_mode: rel
    T_max: null
    eta_min: null

# ── Trainer ───────────────────────────────────────────────────────────────────
trainer:
  min_epochs: 1
  max_epochs: 50
  max_steps: -1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  accumulate_grad_batches: 1
  precision: 32

# ── Callbacks ─────────────────────────────────────────────────────────────────
callbacks:
  model_checkpoint:
    monitor: "val/silhouette"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "epoch_{epoch:03d}"
  early_stopping:
    monitor: "val/con_loss"
    patience: 20
    mode: "min"

# ── Logger ────────────────────────────────────────────────────────────────────
logger:
  mlflow:
    experiment_name: "ablation_loss_contrastive"
    run_name: "ablation_aug_supcon_loss_backbone"

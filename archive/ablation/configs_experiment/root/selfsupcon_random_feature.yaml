# @package _global_
# SelfSupCon — random masking, feature-level (baseline augmentation)
# Usage: python src/train.py experiment=ablation/selfsupcon_random_feature seed=42

defaults:
  - ablation/backbone_selfsupcon
  - _self_

tags: ["ablation", "augmentation", "selfsupcon", "random", "feature_level"]

model:
  augmentation_type: "random"
  mask_full_particle: false
  mask_probability: 0.3

logger:
  mlflow:
    run_name: "ablation_selfsupcon_random_feature"

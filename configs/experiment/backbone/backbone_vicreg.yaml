# @package _global_
#
# VICReg backbone for training (d_model) ablation.
# Augmentation: random particle-level masking (best from augmentation ablation).
# Loss: inv=25, var=25, cov=1 (VICReg defaults).

defaults:
  - backbone_common
  - override /model: vicreg
  - override /callbacks: supcon
  - override /trainer: gpu
  - override /paths: backbone_cern
  - _self_

tags: ["ablation", "training", "vicreg", "100k", "random_particle"]

model:
  d_model: 128
  n_heads: 8
  num_layers: 6
  d_ff: 512
  dropout: 0.1
  compile: false

  projection_dim: 64
  hidden_projection_dim: 256

  augmentation_type: "random"
  mask_full_particle: true
  mask_probability: 0.3
  mask_noise_std: 0.0
  use_classification_head: false

  inv_weight: 25.0
  var_weight: 25.0
  cov_weight: 1.0

  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 1e-3
    weight_decay: 1e-5
    eps: 1e-08
    betas: [0.9, 0.999]

  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: min
    factor: 0.2
    patience: 10
    threshold: 0.0001
    threshold_mode: rel
    T_max: null
    eta_min: null

trainer:
  min_epochs: 1
  max_epochs: 50
  max_steps: -1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  accumulate_grad_batches: 1
  precision: 32

callbacks:
  model_checkpoint:
    monitor: "val/vicreg_loss"
    mode: "min"
    save_top_k: 1
    save_last: true
    filename: "epoch_{epoch:03d}"
  early_stopping:
    monitor: "val/vicreg_loss"
    patience: 20
    mode: "min"

logger:
  mlflow:
    experiment_name: "ablation_training"
    run_name: "ablation_vicreg_training_backbone"

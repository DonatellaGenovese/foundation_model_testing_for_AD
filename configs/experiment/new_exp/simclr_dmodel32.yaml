# @package _global_
# SimCLR (SelfSupCon) — d_model=32, OLD hparams + n_heads=8 fixed (d_ff=256, hidden=64)
defaults:
  - backbone/backbone_selfsupcon
  - new_exp/_final_simclr
  - _self_

tags: ["new_exp", "simclr", "dmodel32", "cern", "old_hparams"]

model:
  d_model: 32
  n_heads: 8
  d_ff: 256
  hidden_projection_dim: 64

logger:
  mlflow:
    run_name: "simclr_dmodel32"
